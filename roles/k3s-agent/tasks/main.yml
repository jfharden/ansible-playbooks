---
- name: Check if k3s is installed
  ansible.builtin.command: k3s --version
  changed_when: false
  ignore_errors: true
  register: k3s_version_check

- name: Set the already installed version facts
  ansible.builtin.set_fact:
    k3s_installed: "{{ k3s_version_check.rc == 0 }}"
    k3s_installed_version_on_host: >
      {{
        (k3s_version_check.stdout_lines[0] | split )[2]
        if k3s_version_check.rc == 0
        else '-1'
      }}

- name: "Install k3s on agents"
  when: not k3s_installed
  block:
    - name: Get the k3s install script
      become: true
      when: not k3s_installed
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s_installer
        mode: "0700"

    - name: Install k3s agent
      become: true
      ansible.builtin.command:
        argv:
          - /tmp/k3s_installer
          - --server=https://192.168.1.210:6443
      environment:
        K3S_TOKEN: >-
          {{
            hostvars['k8s-1']['k3s_primary_node_token']['content']
            | b64decode
            | trim
          }}
        INSTALL_K3S_VERSION: >-
          {{
            k3s_override_version
            if k3s_override_version is defined
            else hostvars['k8s-1']['k3s_cluster_version']
          }}
        INSTALL_K3S_EXEC: "agent --bind-address {{ ansible_host }}"
      changed_when: true

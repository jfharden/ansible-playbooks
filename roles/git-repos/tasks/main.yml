---
- name: Checkout vimconfig repo
  ansible.builtin.git:
    repo: "{{ item.url }}"
    dest: "{{ item.dir }}"
    accept_hostkey: true
    force: false
    update: false
    version: "{{ item.ref }}"
  loop: "{{ repos_to_clone }}"

- name: Symlink to checkout
  when: item.symlink is defined
  ansible.builtin.file:
    src: "{{ item.dir }}/{{ item.symlink.to }}"
    dest: "{{ item.symlink.from }}"
    state: link
  loop: "{{ repos_to_clone }}"

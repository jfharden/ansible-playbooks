---
- name: Load firmware cmdline
  ansible.builtin.command:
    cmd: cat /boot/firmware/cmdline.txt
  register: k3s_boot_firmware_cmdline
  changed_when: false

- name: Set cgroup_memory option
  become: true
  when: k3s_boot_firmware_cmdline.stdout is not search("cgroup_memory=1")
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    regex: '^(.*)$'
    line: '\1 cgroup_memory=1'
    backrefs: true
  notify:
    - reboot machine

- name: Set cgroup_enable option
  become: true
  when: k3s_boot_firmware_cmdline.stdout is not search("cgroup_enable=memory")
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    regex: '^(.*)$'
    line: '\1 cgroup_enable=memory'
    backrefs: true
  notify:
    - reboot machine

# This is requird since haproxy wants to bind to the keepalived IP address, but
# that IP moves between servers, also there's a circular relationship where
# keepalived will only hold the IP if haproxy is alive, but haproxy cannot
# be alive when the IP isn'to available to bind
- name: Allow binding to non-local ip
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    reload: true

- name: Reboot
  ansible.builtin.meta: flush_handlers

- name: Setup haproxy
  ansible.builtin.include_tasks: ./haproxy.yml

- name: Setup keepalived
  ansible.builtin.include_tasks: ./keepalived.yml

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Setup k3s
  ansible.builtin.include_tasks: ./k3s.yml

---
- hosts: k8s_control_nodes 
  roles:
    - role: eviljonny-user
      vars:
        passwordless_sudo: true
    - gitdevel-setup
    - bash-config
    - asdf-setup
    - role: vim-config
      vars:
        remove_vim_instant_markdown: true
        force_plain_vim: true
    - common-tools
    - k3s

- hosts: k8s_agents
  roles:
    - k3s-agent
